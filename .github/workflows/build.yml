name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        working-directory: DevBar
        run: |
          xcodebuild -project DevBar.xcodeproj \
            -scheme DevBar \
            -configuration Release \
            -derivedDataPath ../build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create DMG
        run: |
          mkdir -p stage
          cp -R build/Build/Products/Release/DevBar.app stage/
          hdiutil create \
            -volname "DevBar" \
            -srcfolder stage \
            -ov \
            -format UDZO \
            "DevBar-${{ steps.version.outputs.tag }}.dmg"
          rm -rf stage

      - name: Calculate SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 DevBar-*.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DevBar ${{ steps.version.outputs.tag }}"
          body: |
            ## DevBar ${{ steps.version.outputs.tag }}

            ### Install via Homebrew
            ```bash
            brew tap kv5t/tap
            brew install --cask devbar
            ```

            ### Manual Install
            1. Download `DevBar-${{ steps.version.outputs.tag }}.dmg` below
            2. Open the DMG and drag DevBar to Applications
            3. Launch DevBar from Applications or Spotlight

            ### Requirements
            - macOS 14.0+ (Sonoma or later)
          files: DevBar-${{ steps.version.outputs.tag }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          HAS_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
        run: |
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/kv5t/homebrew-tap.git tap
          cd tap

          cat > Casks/devbar.rb << 'EOF'
          cask "devbar" do
            version "${{ steps.version.outputs.tag }}"
            sha256 "${{ steps.sha.outputs.sha256 }}"

            url "https://github.com/kv5t/devbar/releases/download/v${{ steps.version.outputs.tag }}/DevBar-${{ steps.version.outputs.tag }}.dmg"
            name "DevBar"
            desc "Developer menu bar app for tunnels, ports and containers"
            homepage "https://github.com/kv5t/devbar"

            depends_on macos: ">= :sonoma"

            app "DevBar.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/DevBar.app"],
                             print_stderr: false
            end

            zap trash: [
              "~/Library/Application Support/DevBar",
              "~/Library/Preferences/com.devbar.app.plist",
              "~/Library/Caches/com.devbar.app",
            ]
          end
          EOF

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Casks/devbar.rb
          git diff --cached --quiet || git commit -m "Update DevBar to ${{ steps.version.outputs.tag }}"
          git push

  ci:
    runs-on: macos-15
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        working-directory: DevBar
        run: |
          xcodebuild -project DevBar.xcodeproj \
            -scheme DevBar \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        working-directory: DevBar
        run: |
          xcodebuild test \
            -project DevBar.xcodeproj \
            -scheme DevBar \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
